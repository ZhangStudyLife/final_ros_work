DWAPlannerROS:
  max_vel_x: 0.32
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.32
  min_vel_trans: 0.04

  max_vel_theta: 2.40
  min_vel_theta: 0.15

  acc_lim_x: 3.0
  acc_lim_y: 0.0
  acc_lim_theta: 4.0

  xy_goal_tolerance: 0.09
  yaw_goal_tolerance: 0.35
  latch_xy_goal_tolerance: false

  sim_time: 1.4
  vx_samples: 24
  vy_samples: 0
  vth_samples: 48
  controller_frequency: 10.0

  path_distance_bias: 24.0
  goal_distance_bias: 28.0
  occdist_scale: 0.04
  forward_point_distance: 0.25
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
